defaults
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_frontend
    bind *:80

    acl is_admin path_beg /admin
    http-request deny if is_admin

    default_backend http_backend

backend http_backend
    balance source

    option httpchk GET /actuator/health
    http-check expect status 200

    server server-1 server-1:8080 check
    server server-2 server-2:8080 check
    server server-3 server-3:8080 check

