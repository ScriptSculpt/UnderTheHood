services:
  server-1:
    build: .
    container_name: server-1
    environment:
      SERVER_ID: server-1
    ports:
      - "8081:8080"

  server-2:
    build: .
    container_name: server-2
    environment:
      SERVER_ID: server-2
    ports:
      - "8082:8080"

  server-3:
    build: .
    container_name: server-3
    environment:
      SERVER_ID: server-3
    ports:
      - "8083:8080"

  haproxy:
    image: haproxy:alpine
    container_name: haproxy
    ports:
      - "8080:80"
    volumes:
      - ../haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - server-1
      - server-2
      - server-3

  
